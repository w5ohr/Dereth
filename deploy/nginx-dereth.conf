# Dereth — nginx site. Serves the static game client and proxies the /ws WebSocket
# endpoint to the local Python game server. Run `certbot --nginx` afterwards to add
# the TLS (443) server block + HTTP->HTTPS redirect automatically.
#
#   sudo cp deploy/nginx-dereth.conf /etc/nginx/sites-available/dereth
#   sudo ln -s /etc/nginx/sites-available/dereth /etc/nginx/sites-enabled/dereth
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

# #441: WebSocket admission control at the edge, keyed by client IP. These zones live in the http{}
# context — a sites-enabled file is included inside http{}, so top-level directives here are valid.
# limit_conn caps concurrent /ws connections per IP; limit_req caps the connection/handshake rate so
# a single host can't churn sockets to exhaust the upstream game server. (The Python server enforces
# its own global + per-IP caps and a pre-auth timeout as defense in depth.)
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_req_zone  $binary_remote_addr zone=ws_req:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name www.derethgame.com derethgame.com;   # production domain (both apex + www)

    root /opt/dereth;                         # serves index.html + three.min.js + assets/
    index index.html;

    # ---- security headers --------------------------------------------------
    # HSTS (force TLS after first visit — certbot's 443 block redirects but adds no HSTS), MIME-sniff
    # protection, and clickjacking protection. NOTE nginx add_header inheritance: a location with its
    # OWN add_header drops every inherited one, so these are repeated in the caching locations below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # #809: the webroot is the git working tree, so serve ONLY the client (index.html, js/, vendor/,
    # assets/, sw.js, manifest). Deny every internal directory — previously only server|deploy|.git were
    # blocked, leaving docs/ (incl. the credential-rotation runbook), tools/, and the extractor sources
    # publicly fetchable. Order matters: nginx uses the first matching regex location.
    location ~ ^/(server|deploy|docs|tools|ACE-World-16PY-master|\.git|\.github|\.claude|acdata)/ { deny all; }
    # dotfiles/dirs (.gitignore, .DS_Store, …) — but keep /.well-known reachable for certbot renewals.
    location ~ /\.(?!well-known) { deny all; }
    # source + data files that only ever live in the repo, never served to the client
    location ~* \.(md|py|cs|sh|db|zip|command)$ { deny all; }

    # ---- compression -------------------------------------------------------
    # A cold load pulls ~21 MB, and it is overwhelmingly text: index.html (2.4 MB),
    # acdialogue.json (2.4 MB), acheads/palettes.json (1.7 MB), acspellstats.json (1.8 MB)...
    # Measured gzip -6: index.html -> 30%, acspellstats.json -> 10%. Do NOT list png/jpg/glb/mp3/ogg
    # here: they are already compressed, so gzipping them burns CPU for ~0% and can grow the payload.
    gzip              on;
    gzip_vary         on;              # cache-correctness: vary on Accept-Encoding
    gzip_comp_level   6;               # 6 is the knee; 9 costs ~2x CPU for ~1% more
    gzip_min_length   1024;            # below ~1 KB the gzip header outweighs the saving
    gzip_proxied      any;
    gzip_types        application/json application/javascript text/javascript
                      text/css text/plain image/svg+xml;
    # (text/html is always gzipped by nginx and must not be listed in gzip_types)

    # ---- caching -----------------------------------------------------------
    # assets/ is content-addressed in practice: these files only change when the extractors are
    # re-run, and a changed asset ships with a changed index.html. Cache them hard so a returning
    # player re-downloads none of the ~18 MB asset payload.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # three.min.js is pinned (r128, bundled) — safe to cache hard as well.
    location = /three.min.js {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # index.html is the game; it changes on every deploy. Always revalidate (ETag makes the
    # common case a cheap 304, not a 2.4 MB re-download).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # the service worker controls all other caching — it must never itself be served stale,
    # or a returning player keeps running an old SW that pins old asset URLs.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # WebSocket endpoint -> Python game server (client connects to wss://<host>/ws)
    location /ws {
        # #441: bound per-IP concurrency + connection rate before the request reaches the game server.
        limit_conn ws_conn 16;                # max concurrent /ws connections per client IP
        limit_req  zone=ws_req burst=20 nodelay;   # ~10 handshakes/s per IP (burst 20), reject the rest
        limit_conn_status 429;
        limit_req_status  429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;             # long-lived game connections
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
